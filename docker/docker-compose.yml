name: soulsearcher

services:
  # ---------- PostgreSQL (pgvector) ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soulsearcher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-manus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-manus} -d $${POSTGRES_DB:-manus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soulsearcher-net

  # ---------- Redis (cache / runtime services) ----------
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: soulsearcher_redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--maxmemory 256mb --maxmemory-policy allkeys-lru"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - soulsearcher-net

  # ---------- Backend (FastAPI + LangGraph) ----------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-1200}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    container_name: soulsearcher_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      IDEMPOTENCY_ENABLED: "true"
      BACKGROUND_RUN_LEASE_TTL_SECONDS: "1800"
      BACKGROUND_RUNS_ENABLED: "true"
      SOULSEARCHER_BACKGROUND_EXECUTION_BACKEND: ${SOULSEARCHER_BACKGROUND_EXECUTION_BACKEND:-local}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: soulsearcher-deep-research
      LLM_RELIABILITY_ENABLED: "true"
      LLM_RETRY_MAX_ATTEMPTS: "3"
      LLM_CIRCUIT_BREAKER_FAILURES: "5"
      LLM_CIRCUIT_BREAKER_RESET_SECONDS: "60"
      ENABLE_PROMETHEUS: "true"
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-manus}:${POSTGRES_PASSWORD:-manus_dev_password}@postgres:5432/${POSTGRES_DB:-manus_db}
      MEMORY_ENABLED: "true"
      MEMORY_BACKEND: postgres
      MEMORY_DATABASE_URL: postgresql://${POSTGRES_USER:-manus}:${POSTGRES_PASSWORD:-manus_dev_password}@postgres:5432/${POSTGRES_DB:-manus_db}
      SOULSEARCHER_DATA_DIR: /app/.docker-data/data
      SOULSEARCHER_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8001}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3100},http://127.0.0.1:${FRONTEND_PORT:-3100}
      TOOL_RETRY: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    volumes:
      - ..:/app
      - ../.docker-data:/app/.docker-data
      - ../logs:/app/logs
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - soulsearcher-net

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: soulsearcher_temporal
    profiles: ["temporal"]
    restart: unless-stopped
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-manus}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-manus_dev_password}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - soulsearcher-net

  temporal-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-1200}
        PIP_RETRIES: ${PIP_RETRIES:-10}
    container_name: soulsearcher_temporal_worker
    profiles: ["temporal"]
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-manus}:${POSTGRES_PASSWORD:-manus_dev_password}@postgres:5432/${POSTGRES_DB:-manus_db}
      MEMORY_DATABASE_URL: postgresql://${POSTGRES_USER:-manus}:${POSTGRES_PASSWORD:-manus_dev_password}@postgres:5432/${POSTGRES_DB:-manus_db}
      BACKGROUND_RUNS_ENABLED: "true"
      SOULSEARCHER_BACKGROUND_EXECUTION_BACKEND: temporal
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: soulsearcher-deep-research
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ..:/app
      - ../.docker-data:/app/.docker-data
      - ../logs:/app/logs
    command: ["python", "-m", "agent.runtime.temporal_worker"]
    networks:
      - soulsearcher-net

  # ---------- Frontend (Next.js dev server) ----------
  frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: soulsearcher_frontend
    restart: unless-stopped
    environment:
      FRONTEND_PORT: "3100"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${BACKEND_PORT:-8001}
      NEXT_PUBLIC_CHAT_STREAM_PROTOCOL: ${NEXT_PUBLIC_CHAT_STREAM_PROTOCOL:-sse}
      NEXT_PUBLIC_RESEARCH_STREAM_PROTOCOL: ${NEXT_PUBLIC_RESEARCH_STREAM_PROTOCOL:-sse}
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3100}:3100"
    volumes:
      - ../web:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - soulsearcher-net

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:

networks:
  soulsearcher-net:
    driver: bridge
